        function getRatingColor(val) {
            const r = parseFloat(val);
            if (r >= 8.0) return 'text-[#22c55e]'; // Hijau Gelap/Terang
            if (r >= 7.0) return 'text-[#84cc16]'; // Hijau Redup
            if (r >= 6.0) return 'text-[#eab308]'; // Kuning
            return 'text-[#ef4444]'; // Merah
        }

        function init() {
            const tableBody = document.getElementById('movie-table-body');
            const featuredGrid = document.getElementById('featured-grid');
            const csBody = document.getElementById('coming-soon-body');

                const colorClass = getRatingColor(m.rating);

                if (m.image) {
                    featuredGrid.innerHTML += `
                        <div onclick='openDetail(${JSON.stringify(m)})' class="glass-card p-4 flex items-center gap-6 cursor-pointer hover:scale-[1.02] transition-transform group">

                                <div class="mt-3 flex items-center gap-1.5 ${colorClass} font-bold text-sm">
                                    ${STAR_SVG} ${m.rating}
                                </div>
                            </div>
                        </div>
                    `;
                }

                tableBody.innerHTML += `
                    <tr onclick='openDetail(${JSON.stringify(m)})' class="table-row-hover group">
                        <td class="py-6 px-8">
                            <div class="text-white/60 font-bold group-hover:text-white transition-colors text-base">${m.title}</div>
                            <div class="text-[9px] uppercase tracking-widest text-white/10 font-bold mt-1">${m.genre}</div>
                        </td>
                        <td class="py-6 px-8 text-center text-xs font-mono text-white/20">${m.year}</td>
                        <td class="py-6 px-8 text-right">
                            <div class="flex items-center justify-end gap-2 ${colorClass} font-black text-base">
                                ${STAR_SVG} ${m.rating}
                            </div>
                        </td>
                    </tr>
                `;
            });

            COMING_SOON.forEach(c => {
                csBody.innerHTML += `
                    <tr onclick='openDetail(${JSON.stringify(c)})' class="table-row-hover group">
                        <td class="py-6 px-8">
                            <div class="text-white font-bold group-hover:text-blue-400 transition-colors text-lg">${c.title}</div>
                            <div class="text-[9px] uppercase tracking-widest text-blue-500/40 font-bold mt-1">${c.genre}</div>
                        </td>
                        <td class="py-6 px-8 text-right text-sm font-black text-white/40 italic">${c.year}</td>
                    </tr>
                `;
            });
        }

        function openDetail(m) {
            document.getElementById('modal-title').innerText = m.title;
            document.getElementById('modal-desc').innerText = m.desc;
            document.getElementById('modal-year').innerText = "Status: " + (m.rating ? "Tayang" : "Akan Rilis") + " / " + m.year;
            document.getElementById('modal-genre').innerText = m.genre;
            
            const r = document.getElementById('modal-rating');
            const rCont = document.getElementById('modal-rating-container');
            if(m.rating) {
                r.innerText = m.rating;
                r.className = `text-2xl font-black ${getRatingColor(m.rating)}`;
                rCont.style.display = 'flex';
            } else {
                rCont.style.display = 'none';
            }

            const img = document.getElementById('modal-img');
            const container = document.getElementById('modal-img-container');
            if (m.image) {
                img.src = "/static/" + m.image;
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }

            document.getElementById('detail-overlay').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeDetail() {
            document.getElementById('detail-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onclick = e => { if (e.target.id === 'detail-overlay') closeDetail(); }
        init();
    </script>
</body>
